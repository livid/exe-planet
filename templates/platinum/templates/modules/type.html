<script>
  // A post's type, the reader's to choose with the controls at the far
  // end of the strip: − and + step the text's size, Sans Serif | Serif
  // its face. The view is also the address's, ?size=16&font=serif (each
  // only when it is not the default, 12 and sans), so a link carries what
  // its sender saw: a page asked for that way shows it, and one asked
  // for without either takes the choice this browser keeps in
  // localStorage, else the default. A press keeps the choice and writes
  // it into the address; a view that came from a link is shown, not
  // kept. The language line's links carry the view on. All of it is put
  // on <html> here, before anything is drawn, so the text never changes
  // under the reader; the buttons' pressed and dimmed looks follow from
  // <html>'s classes, their own state (disabled, aria-pressed) is set
  // once they exist. Without script the controls are not shown.
  (() => {
    const KEY = "platinum-type", SIZES = [10, 11, 12, 14, 16, 18, 20, 24], doc = document.documentElement;
    const t = { size: 12, face: "sans" };
    const take = o => {
      if (SIZES.includes(+o.size)) t.size = +o.size;
      if (o.face === "serif") t.face = "serif";
    };
    const q = new URLSearchParams(location.search);
    if (q.has("size") || q.has("font")) take({ size: q.get("size"), face: q.get("font") });
    else try { take(JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
    // the view as the address says it: the defaults are left out
    const view = href => {
      const u = new URL(href, location.href);
      if (t.size === 12) u.searchParams.delete("size"); else u.searchParams.set("size", t.size);
      if (t.face === "sans") u.searchParams.delete("font"); else u.searchParams.set("font", t.face);
      return u;
    };
    const apply = keep => {
      const i = SIZES.indexOf(t.size);
      doc.style.setProperty("--ts", t.size + "px");
      doc.classList.add("type-on");
      doc.classList.toggle("serif", t.face === "serif");
      doc.classList.toggle("ts-min", i === 0);
      doc.classList.toggle("ts-max", i === SIZES.length - 1);
      for (const b of document.querySelectorAll(".type [data-type]")) {
        const v = b.dataset.type;
        if (v === "smaller") b.disabled = i === 0;
        else if (v === "bigger") b.disabled = i === SIZES.length - 1;
        else b.setAttribute("aria-pressed", String(v === t.face));
      }
      // (inside the app that writes the site, a frame with no address of
      // its own, there is no address to write and none to resolve against)
      if (location.protocol !== "about:") try {
        for (const a of document.querySelectorAll(".langs a")) a.href = view(a.getAttribute("href")).href;
        const u = view(location.href);
        if (u.href !== location.href) history.replaceState(history.state, "", u);
      } catch (e) {}
      if (keep) try { localStorage.setItem(KEY, JSON.stringify(t)); } catch (e) {}
    };
    apply(false);
    document.addEventListener("DOMContentLoaded", () => apply(false));
    addEventListener("click", e => {
      const b = e.target.closest && e.target.closest(".type [data-type]");
      if (!b || b.disabled) return;
      const v = b.dataset.type, i = SIZES.indexOf(t.size);
      if (v === "smaller") t.size = SIZES[Math.max(0, i - 1)];
      else if (v === "bigger") t.size = SIZES[Math.min(SIZES.length - 1, i + 1)];
      else t.face = v;
      apply(true);
    });
  })();
</script>
